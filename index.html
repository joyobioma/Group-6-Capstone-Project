<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Group 6">
  <title>Planets Fact Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <!-- header -->
      <div class="top">
        <div>
          <img src="svg/logo_black.svg" alt="planet-home">
        </div>
        <button class="theme-switcher" type="button" aria-label="switch to dark theme">
          <span>DARK</span>
          <img src="svg/Theme Icon (1).svg" alt="Theme switcher icon">
        </button>
      </div>

      <!-- search bar-->
       <div class="search">
            <img src="svg/Search Icon.svg" alt="">
            <input type="search" placeholder="Search planet name">
            <button>Search</button>  
       </div>
    </header>
    <main>

      <!-- planet card -->
      <section class="planet-card">
          <img src="images/Profile Picture.jpg" class="planet-image" alt="planet image">
          <div class="planet-title">
            <h1>Earth</h1>
            <p class="planet-type">Terrestrial</p>
          </div>
        <p class="planet-description">The only known planet to support   life, with liquid water on its surface.</p>

          <div class="planet-details">
            <div>
              <p>Gravity</p>
              <span>9.8</span>
            </div>
            <div>
              <p>Mass</p>
            <span>0.00315</span>
            </div>
            <div>
              <p>Period</p>
              <span>365</span>
            </div>
        </div>

        <div class="planet-weather">
          <div class="planet-stats">
            <div><img src="svg/Temperature icon.svg" alt=""></div>
            <div><span>288</span></div>
          </div>
          <div class="planet-stats">
            <div><img src="svg/Half moon.svg"></div>
            <div><span>1</span></div>
          </div>
          
          <div class="planet-stats">
            <div><img src="svg/Diameter.svg" alt=""></div>
            <div><span>12756</span></div>
          </div>

          <div class="planet-stats">
            <div><img src="svg/Company Icon.svg" alt=""></div>
            <div><span>149.6</span></div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
